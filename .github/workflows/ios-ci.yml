name: iOS CI (KMP)

on:
  workflow_call:
    secrets:
      GOOGLE_CLIENT_ID:
        required: true
      SUPABASE_URL:
        required: true
      SUPABASE_KEY:
        required: true
      IOS_GOOGLE_SERVICE_INFO_PLIST:
        required: true
      IOS_INFO_PLIST:
        required: true

jobs:
  ios-build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Create local.properties
        run: |
          cat > local.properties << EOF
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
          EOF

      - name: Decode and setup iOS configuration files
        run: |
          echo "${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST }}" | base64 --decode > iosApp/iosApp/GoogleService-Info.plist
          echo "${{ secrets.IOS_INFO_PLIST }}" | base64 --decode > iosApp/iosApp/Info.plist

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Konan
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*') }}

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            iosApp/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Generate Dummy Framework for CocoaPods
        run: ./gradlew :composeApp:generateDummyFramework

      - name: Install CocoaPods dependencies
        working-directory: iosApp
        run: |
          sudo gem install cocoapods -v 1.16.2
          pod install --repo-update

      - name: Build iOS Debug Framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace --info
      
      - name: Build iOS App (Xcode)
        working-directory: iosApp
        run: |
          xcodebuild clean build \
            -workspace iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro' \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64
